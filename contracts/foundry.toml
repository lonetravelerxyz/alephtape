[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "../circuits" }]

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"

